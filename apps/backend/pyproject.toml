[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vibe-coding-backend"
version = "0.1.0"
description = "Backend FastAPI de la Plataforma Vibe Coding"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<0.116",
  "uvicorn[standard]>=0.30,<0.31",
  "gunicorn>=22,<23",
  "pydantic[email]>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "sqlalchemy>=2.0,<2.1",
  "alembic>=1.13,<2",
  "psycopg[binary]>=3.2,<4",
  "python-jose[cryptography]>=3.3,<4",
  "bcrypt>=4.1,<6",
  "python-multipart>=0.0.9",
  "Pillow>=11.0,<13",
  "numpy>=2.1,<3",
  "httpx>=0.27,<0.28",
  "anthropic>=0.34,<1",
  "lancedb>=0.15,<1",
  "python-docx>=1.1,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.23,<0.24",
  "ruff>=0.6,<0.7",
  "black>=24.8,<25",
  "factory-boy>=3.3,<4",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: Depends(...)/require_permission(...) en defaults es el idiom de DI de FastAPI,
# no el antipatron de argumentos mutables que la regla busca detectar.
ignore = ["B008"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
