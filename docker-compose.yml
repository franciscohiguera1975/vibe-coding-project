services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vibe_coding}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vibe_coding}
      POSTGRES_DB: ${POSTGRES_DB:-vibe_coding_dev}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vibe_coding}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
